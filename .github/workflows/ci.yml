name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q tests
      - run: pip install pip-audit && pip-audit -r app/requirements.txt
